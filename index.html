<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Produtos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    #mensagem { margin-top: 15px; padding: 10px; display: none; border-radius: 4px; background-color: #d4edda; color: #155724; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #0066cc; color: white; }
  </style>
</head>
<body>

<div class="container">
  <h2>Cadastro de Produto</h2>
  <form id="cadastroForm">
    <div class="form-group">
      <label for="codigo">Código do Produto</label>
      <input type="text" id="codigo" name="codigo" required autocomplete="off" autofocus>
    </div>
    <div class="form-group">
      <label for="nome">Nome do Produto</label>
      <input type="text" id="nome" name="nome" required autocomplete="off">
    </div>
    <div class="form-group">
      <label for="categoria">Categoria</label>
      <input type="text" id="categoria" name="categoria" required autocomplete="off">
    </div>
    <div class="form-group">
      <label for="preco">Preço (R$)</label>
      <input type="text" id="preco" name="preco" required autocomplete="off">
    </div>
    <button type="submit">Cadastrar</button>
  </form>

  <div id="mensagem">Produto cadastrado com sucesso!</div>

  <h3>Produtos Cadastrados</h3>
  <table id="tabelaProdutos">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nome</th>
        <th>Categoria</th>
        <th>Preço</th>
      </tr>
    </thead>
    <tbody>
      <!-- Linhas inseridas via JavaScript -->
    </tbody>
  </table>
</div>

<script>
  document.getElementById('cadastroForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
   
    const codigo = document.getElementById('codigo').value;
    const nome = document.getElementById('nome').value;
    const categoria = document.getElementById('categoria').value;
    const preco = document.getElementById('preco').value;

    
    const tbody = document.querySelector('#tabelaProdutos tbody');
    const novaLinha = document.createElement('tr');
    novaLinha.innerHTML = `<td>${codigo}</td><td>${nome}</td><td>${categoria}</td><td>R$ ${preco}</td>`;
    tbody.appendChild(novaLinha);

    
    const msg = document.getElementById('mensagem');
    msg.style.display = 'block';

    
    e.target.reset();
    document.getElementById('codigo').focus();
  });
</script>

</body>
</html>
